{% extends 'counseling/base.html' %}
{% block content %}
<h2>Login</h2>
<form method="post" class="card">
    {% csrf_token %}
    {% for field in form %}
    <div class="field">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p style="color:#b3261e; font-size:12px;">{{ field.errors|striptags }}</p>{% endif %}
    </div>
    {% endfor %}
    <button type="submit">Login</button>
</form>
<p style="margin-top:16px;">No account yet? <a href="{% url 'register' %}">Register</a></p>
{% endblock %}
